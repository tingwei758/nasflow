# nasflow — every setting nasflow itself reads is in config.toml. The values
# here are the ones Docker needs before nasflow starts; edit them in place.
services:
  nasflow:
    build: .
    image: nasflow:latest
    container_name: nasflow
    restart: unless-stopped
    # Same owner as qBittorrent's files, so nasflow may hardlink them.
    user: "911:911"
    environment:
      NASFLOW_CONFIG: /config/config.toml
    volumes:
      # ONE read-write mount covering both downloads and staging, at the same
      # path as on the host. Hardlinks cannot cross bind mounts: mounting
      # downloads and staging separately (or downloads :ro) makes every link
      # fail with EXDEV. nasflow's own code confines writes to staging_root.
      # The media library is deliberately not mounted at all.
      - /volume1/docker/qb:/volume1/docker/qb
      # config.toml and nasflow.db, in the data/ folder next to this file.
      - /volume1/docker/nasflow/data:/config
    ports:
      # LAN only: nasflow has no authentication by design. The NAS's LAN
      # address, the port to open the board on, and config.toml's bind_port.
      - "192.168.4.126:9987:9987"
