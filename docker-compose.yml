# flow — every host path comes from .env (copy .env.example to .env).
services:
  flow:
    build: .
    image: nasflow:latest
    container_name: flow
    restart: unless-stopped
    # Same owner as qBittorrent's files, so flow may hardlink them.
    user: "${FLOW_PUID:-911}:${FLOW_PGID:-911}"
    environment:
      FLOW_CONFIG: /config/config.toml
    volumes:
      # ONE read-write mount covering both downloads and staging, at the same
      # path as on the host. Hardlinks cannot cross bind mounts: mounting
      # downloads and staging separately (or downloads :ro) makes every link
      # fail with EXDEV. flow's own code confines writes to staging_root.
      # The media library is deliberately not mounted at all.
      - ${FLOW_QB_ROOT}:${FLOW_QB_ROOT}
      - ${FLOW_CONFIG_DIR}:/config
    ports:
      # LAN only. flow has no authentication by design.
      - "${FLOW_LAN_IP:?set FLOW_LAN_IP in .env}:${FLOW_PORT:-8080}:8080"
